<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CCNA Quiz</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CCNA Quiz" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --muted: #8ea0bd;
      --text: #e8eefc;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #22304a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      background: #0b1220;
      min-height: 100%;
    }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #0b1220, #0f172a 40%, #111827);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
    }
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(56,189,248,0.12);
      border: 1px solid rgba(56,189,248,0.3);
      display: grid;
      place-items: center;
      font-weight: 700;
      color: var(--accent);
    }
    h1 {
      font-size: 1.35rem;
      margin: 0;
    }
    .sub {
      color: var(--muted);
      font-size: .95rem;
      margin-top: 4px;
    }
    .card {
      background: rgba(18,26,43,0.92);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
    }
    .toolbar, .stats, .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar { margin-bottom: 16px; }
    select, button {
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: .95rem;
    }
    button {
      cursor: pointer;
      transition: .18s ease;
    }
    button:hover { transform: translateY(-1px); }
    button.primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      color: white;
      font-weight: 600;
    }
    button.good {
      background: rgba(34,197,94,.12);
      border-color: rgba(34,197,94,.4);
    }
    button.warn {
      background: rgba(245,158,11,.12);
      border-color: rgba(245,158,11,.4);
    }
    button.danger {
      background: rgba(239,68,68,.12);
      border-color: rgba(239,68,68,.4);
    }
    .stats {
      margin: 14px 0 18px;
    }
    .pill {
      padding: 10px 12px;
      border-radius: 999px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: .92rem;
    }
    .question-title {
      font-size: 1.15rem;
      margin: 4px 0 8px;
      line-height: 1.4;
    }
    .question-meta {
      color: var(--muted);
      font-size: .92rem;
      margin-bottom: 16px;
    }
    .answers {
      display: grid;
      gap: 12px;
      margin: 18px 0;
    }
    .answer {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      background: #0f172a;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
    }
    .answer input {
      margin-top: 3px;
      transform: scale(1.15);
    }
    .answer.correct {
      border-color: rgba(34,197,94,.6);
      background: rgba(34,197,94,.13);
    }
    .answer.wrong {
      border-color: rgba(239,68,68,.6);
      background: rgba(239,68,68,.13);
    }
    .feedback {
      min-height: 24px;
      margin: 8px 0 14px;
      color: var(--muted);
    }
    .progress {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: #0f172a;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 12px;
    }
    .progress > div {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      width: 0;
      transition: width .25s ease;
    }
    .muted {
      color: var(--muted);
    }
    .empty {
      text-align: center;
      padding: 30px 10px;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      .app { padding: 14px; }
      .card { padding: 14px; }
      h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">CC</div>
        <div>
          <h1>CCNA Quiz Trainer</h1>
          <div class="sub">PWA-Prototyp für Modultraining mit Lernständen</div>
        </div>
      </div>
      <button id="installBtn" hidden>App installieren</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <select id="moduleSelect"></select>
        <select id="modeSelect">
          <option value="all">Alle Fragen</option>
          <option value="wrong">Nur falsch beantwortete</option>
          <option value="correct">Nur richtig beantwortete</option>
          <option value="unseen">Nur offene Fragen</option>
        </select>
        <button id="newQuestionBtn">Neue Zufallsfrage</button>
        <button id="resetProgressBtn" class="danger">Fortschritt zurücksetzen</button>
      </div>

      <div class="stats">
        <div class="pill" id="statTotal">Gesamt: 0</div>
        <div class="pill" id="statCorrect">Richtig: 0</div>
        <div class="pill" id="statWrong">Falsch: 0</div>
        <div class="pill" id="statOpen">Offen: 0</div>
      </div>

      <div class="progress"><div id="progressBar"></div></div>

      <div id="quizArea"></div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script>
    const STORAGE_KEY = 'ccna-quiz-progress-v1';
    let deferredPrompt = null;
    let state = loadState();
    let currentQuestion = null;
    let currentShuffledAnswers = [];

    const moduleSelect = document.getElementById('moduleSelect');
    const modeSelect = document.getElementById('modeSelect');
    const quizArea = document.getElementById('quizArea');
    const installBtn = document.getElementById('installBtn');

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : { progress: {}, lastModuleId: 'module-1', lastMode: 'all' };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function ensureModuleState(moduleId) {
      if (!state.progress[moduleId]) state.progress[moduleId] = {};
    }

    function getModule() {
      return MODULES.find(m => m.id === moduleSelect.value) || MODULES[0];
    }

    function getQuestionStatus(moduleId, questionId) {
      ensureModuleState(moduleId);
      return state.progress[moduleId][questionId] || { seen: 0, correct: 0, wrong: 0, lastResult: null };
    }

    function setQuestionStatus(moduleId, questionId, result) {
      ensureModuleState(moduleId);
      const prev = getQuestionStatus(moduleId, questionId);
      state.progress[moduleId][questionId] = {
        seen: prev.seen + 1,
        correct: prev.correct + (result === 'correct' ? 1 : 0),
        wrong: prev.wrong + (result === 'wrong' ? 1 : 0),
        lastResult: result
      };
      saveState();
    }

    function getPool(module, mode) {
      return module.questions.filter(q => {
        const s = getQuestionStatus(module.id, q.id);
        if (mode === 'correct') return s.lastResult === 'correct';
        if (mode === 'wrong') return s.lastResult === 'wrong';
        if (mode === 'unseen') return s.seen === 0;
        return true;
      });
    }

    function updateStats() {
      const module = getModule();
      const statuses = module.questions.map(q => getQuestionStatus(module.id, q.id));
      const correct = statuses.filter(s => s.lastResult === 'correct').length;
      const wrong = statuses.filter(s => s.lastResult === 'wrong').length;
      const open = statuses.filter(s => s.seen === 0).length;
      document.getElementById('statTotal').textContent = `Gesamt: ${module.questions.length}`;
      document.getElementById('statCorrect').textContent = `Richtig: ${correct}`;
      document.getElementById('statWrong').textContent = `Falsch: ${wrong}`;
      document.getElementById('statOpen').textContent = `Offen: ${open}`;
      const done = correct + wrong;
      document.getElementById('progressBar').style.width = `${Math.round((done / module.questions.length) * 100)}%`;
    }

    function renderEmpty(message) {
      quizArea.innerHTML = `<div class="empty">${message}</div>`;
    }

    function nextRandomQuestion() {
      const module = getModule();
      const pool = getPool(module, modeSelect.value);
      if (!pool.length) {
        renderEmpty('Für diesen Filter gibt es aktuell keine Fragen.');
        updateStats();
        return;
      }
      currentQuestion = pool[Math.floor(Math.random() * pool.length)];
      currentShuffledAnswers = shuffle(currentQuestion.answers);
      renderQuestion();
      updateStats();
    }

    function renderQuestion() {
      const isMulti = currentQuestion.type === 'multi';
      const status = getQuestionStatus(getModule().id, currentQuestion.id);
      quizArea.innerHTML = `
        <div class="question-title">${currentQuestion.question}</div>
        <div class="question-meta">${isMulti ? 'Mehrfachauswahl' : 'Einfachauswahl'} · Bisher gesehen: ${status.seen}</div>
        <div class="answers">
          ${currentShuffledAnswers.map((a, i) => `
            <label class="answer" data-answer="${escapeHtml(a)}">
              <input type="${isMulti ? 'checkbox' : 'radio'}" name="answer" value="${escapeHtml(a)}">
              <span>${escapeHtml(a)}</span>
            </label>
          `).join('')}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="primary" id="checkBtn">Antwort prüfen</button>
          <button id="skipBtn">Überspringen</button>
        </div>
      `;
      document.getElementById('checkBtn').addEventListener('click', checkAnswer);
      document.getElementById('skipBtn').addEventListener('click', nextRandomQuestion);
    }

    function escapeHtml(str) {
      return str.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    }

    function checkAnswer() {
      const selected = [...quizArea.querySelectorAll('input[name="answer"]:checked')].map(i => i.value);
      if (!selected.length) {
        document.getElementById('feedback').textContent = 'Bitte wähle erst eine Antwort aus.';
        return;
      }
      const correct = [...currentQuestion.correct].sort();
      const given = [...selected].sort();
      const ok = JSON.stringify(correct) === JSON.stringify(given);

      quizArea.querySelectorAll('.answer').forEach(label => {
        const value = label.dataset.answer;
        if (currentQuestion.correct.includes(value)) label.classList.add('correct');
        if (selected.includes(value) && !currentQuestion.correct.includes(value)) label.classList.add('wrong');
      });

      setQuestionStatus(getModule().id, currentQuestion.id, ok ? 'correct' : 'wrong');
      document.getElementById('feedback').textContent = ok ? 'Richtig beantwortet.' : 'Nicht ganz. Die richtige Lösung ist markiert.';
      updateStats();

      const checkBtn = document.getElementById('checkBtn');
      checkBtn.textContent = 'Nächste Frage';
      checkBtn.replaceWith(checkBtn.cloneNode(true));
      document.getElementById('checkBtn').addEventListener('click', nextRandomQuestion);
    }

    function populateModules() {
      moduleSelect.innerHTML = MODULES.map(m => `<option value="${m.id}">${m.title}</option>`).join('');
      moduleSelect.value = state.lastModuleId || MODULES[0].id;
      modeSelect.value = state.lastMode || 'all';
    }

    moduleSelect.addEventListener('change', () => {
      state.lastModuleId = moduleSelect.value;
      saveState();
      nextRandomQuestion();
    });

    modeSelect.addEventListener('change', () => {
      state.lastMode = modeSelect.value;
      saveState();
      nextRandomQuestion();
    });

    document.getElementById('newQuestionBtn').addEventListener('click', nextRandomQuestion);
    document.getElementById('resetProgressBtn').addEventListener('click', () => {
      if (!confirm('Wirklich den kompletten Fortschritt löschen?')) return;
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      populateModules();
      nextRandomQuestion();
    });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    populateModules();
    nextRandomQuestion();
  </script>
</body>
</html>
