<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CCNA Quiz</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CCNA Quiz" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --muted: #8ea0bd;
      --text: #e8eefc;
      --accent: #38bdf8;
      --border: #22304a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0b1220; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #0b1220, #0f172a 40%, #111827);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .app { max-width: 900px; margin: 0 auto; padding: 20px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 48px; height: 48px; border-radius: 14px;
      background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3);
      display: grid; place-items: center; font-weight: 700; color: var(--accent);
      font-size: 1rem;
    }
    h1 { font-size: 1.35rem; }
    .sub { color: var(--muted); font-size: .9rem; margin-top: 3px; }
    .card {
      background: rgba(18,26,43,0.92); border: 1px solid var(--border);
      border-radius: 20px; padding: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25); backdrop-filter: blur(8px);
    }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    select, button {
      border: 1px solid var(--border); background: #0f172a; color: var(--text);
      border-radius: 12px; padding: 11px 14px; font-size: .95rem;
    }
    button { cursor: pointer; transition: .18s ease; }
    button:hover { transform: translateY(-1px); }
    button.primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none; color: white; font-weight: 600;
    }
    button.danger { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 18px; }
    .pill {
      padding: 10px 12px; border-radius: 999px;
      background: #0f172a; border: 1px solid var(--border);
      color: var(--muted); font-size: .92rem;
    }
    .run-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .run-badge {
      background: rgba(56,189,248,.15); border: 1px solid rgba(56,189,248,.4);
      color: var(--accent); border-radius: 999px; padding: 6px 14px; font-size: .9rem;
    }
    .progress {
      width: 100%; height: 10px; border-radius: 999px;
      background: #0f172a; overflow: hidden; border: 1px solid var(--border); margin: 10px 0 18px;
    }
    .progress > div { height: 100%; background: linear-gradient(90deg, #22c55e, #38bdf8); width: 0; transition: width .25s ease; }
    .question-title { font-size: 1.1rem; line-height: 1.45; margin: 4px 0 6px; }
    .question-meta { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
    .answers { display: grid; gap: 10px; margin: 14px 0; }
    .answer {
      border: 1px solid var(--border); border-radius: 14px; padding: 13px;
      background: #0f172a; display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
    }
    .answer input { margin-top: 3px; transform: scale(1.15); }
    .answer.correct { border-color: rgba(34,197,94,.6); background: rgba(34,197,94,.13); }
    .answer.wrong   { border-color: rgba(239,68,68,.6);  background: rgba(239,68,68,.13); }
    .feedback { min-height: 22px; margin: 6px 0 12px; color: var(--muted); font-size: .95rem; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .result-card { text-align: center; padding: 20px 10px; }
    .result-score { font-size: 3rem; font-weight: 700; color: var(--accent); }
    .result-sub { color: var(--muted); margin: 8px 0 20px; font-size: 1rem; }
    .result-breakdown { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
    .result-pill {
      padding: 10px 16px; border-radius: 999px; font-size: .95rem;
      border: 1px solid var(--border); background: #0f172a;
    }
    .result-pill.green { border-color: rgba(34,197,94,.5); color: #4ade80; }
    .result-pill.red   { border-color: rgba(239,68,68,.5);  color: #f87171; }
    .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
    @media (max-width: 640px) {
      .app { padding: 14px; }
      .card { padding: 14px; }
      h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">CC</div>
      <div>
        <h1>CCNA Quiz Trainer</h1>
        <div class="sub">PWA für Modultraining mit Lernständen</div>
      </div>
    </div>
    <button id="installBtn" hidden>App installieren</button>
  </div>
  <div class="card">
    <div class="toolbar">
      <select id="moduleSelect"></select>
      <select id="modeSelect">
        <option value="all">Alle Fragen – Endlosmodus</option>
        <option value="run10">10-Fragen-Run</option>
        <option value="wrong">Nur falsch beantwortete</option>
        <option value="correct">Nur richtig beantwortete</option>
        <option value="unseen">Nur offene Fragen</option>
      </select>
      <button id="newQuestionBtn">Neue Zufallsfrage</button>
      <button id="resetProgressBtn" class="danger">Fortschritt zurücksetzen</button>
    </div>
    <div class="stats">
      <div class="pill" id="statTotal">Gesamt: 0</div>
      <div class="pill" id="statCorrect">Richtig: 0</div>
      <div class="pill" id="statWrong">Falsch: 0</div>
      <div class="pill" id="statOpen">Offen: 0</div>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="quizArea"></div>
  </div>
</div>
<script src="questions.js"></script>
<script>

  const STORAGE_KEY = 'ccna-quiz-progress-v1';
  let deferredPrompt = null;
  let state = loadState();
  let runQueue = [], runIndex = 0, runResults = [], runActive = false;
  let currentQuestion = null;

  const moduleSelect = document.getElementById('moduleSelect');
  const modeSelect   = document.getElementById('modeSelect');
  const quizArea     = document.getElementById('quizArea');
  const installBtn   = document.getElementById('installBtn');

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {progress:{},lastModuleId:null,lastMode:'all'}; }
    catch(e) { return {progress:{},lastModuleId:null,lastMode:'all'}; }
  }

  function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function ensureMod(id) { if (!state.progress[id]) state.progress[id] = {}; }
  function getModule() { return MODULES.find(m => m.id === moduleSelect.value) || MODULES[0]; }

  function getStatus(mid, qid) {
    ensureMod(mid);
    return state.progress[mid][qid] || {seen:0,correct:0,wrong:0,lastResult:null};
  }

  function setStatus(mid, qid, result) {
    ensureMod(mid);
    const p = getStatus(mid, qid);
    state.progress[mid][qid] = {
      seen: p.seen+1,
      correct: p.correct+(result==='correct'?1:0),
      wrong: p.wrong+(result==='wrong'?1:0),
      lastResult: result
    };
    saveState();
  }

  function getPool(mod, mode) {
    return mod.questions.filter(q => {
      const s = getStatus(mod.id, q.id);
      if (mode==='correct') return s.lastResult==='correct';
      if (mode==='wrong')   return s.lastResult==='wrong';
      if (mode==='unseen')  return s.seen===0;
      return true;
    });
  }

  function updateStats() {
    const mod = getModule();
    const ss  = mod.questions.map(q => getStatus(mod.id, q.id));
    const c   = ss.filter(s => s.lastResult==='correct').length;
    const w   = ss.filter(s => s.lastResult==='wrong').length;
    const o   = ss.filter(s => s.seen===0).length;
    document.getElementById('statTotal').textContent   = 'Gesamt: '+mod.questions.length;
    document.getElementById('statCorrect').textContent = 'Richtig: '+c;
    document.getElementById('statWrong').textContent   = 'Falsch: '+w;
    document.getElementById('statOpen').textContent    = 'Offen: '+o;
    document.getElementById('progressBar').style.width = Math.round(((c+w)/mod.questions.length)*100)+'%';
  }

  function escHtml(s) {
    return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  }

  // RUN MODUS
  function startRun() {
    const mod = getModule();
    const pool = shuffle(getPool(mod,'all'));
    if (!pool.length) { quizArea.innerHTML='<div class="empty">Keine Fragen verfügbar.</div>'; return; }
    runQueue=[...pool.slice(0,10)]; runIndex=0; runResults=[]; runActive=true;
    renderRunQ();
  }

  function renderRunQ() {
    const q = runQueue[runIndex];
    const sh = shuffle(q.answers);
    const multi = q.type==='multi';
    quizArea.innerHTML = `
      <div class="run-header">
        <div class="run-badge">Frage ${runIndex+1} / ${runQueue.length}</div>
        <button id="abortBtn" style="font-size:.85rem;padding:7px 12px">Abbrechen</button>
      </div>
      <div class="progress"><div style="height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);width:${Math.round((runIndex/runQueue.length)*100)}%"></div></div>
      <div class="question-title">${escHtml(q.question)}</div>
      <div class="question-meta">${multi?'Mehrfachauswahl':'Einfachauswahl'}</div>
      <div class="answers">${sh.map(a=>`<label class="answer" data-answer="${escHtml(a)}"><input type="${multi?'checkbox':'radio'}" name="ans" value="${escHtml(a)}"><span>${escHtml(a)}</span></label>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="actions">
        <button class="primary" id="checkBtn">Antwort prüfen</button>
        <button id="skipBtn">Überspringen</button>
      </div>`;
    document.getElementById('checkBtn').addEventListener('click', ()=>checkRunQ(q));
    document.getElementById('skipBtn').addEventListener('click',  ()=>nextRun(q,false,true));
    document.getElementById('abortBtn').addEventListener('click',  ()=>{ runActive=false; startNew(); });
  }

  function checkRunQ(q) {
    const sel = [...quizArea.querySelectorAll('input[name="ans"]:checked')].map(i=>i.value);
    if (!sel.length) { document.getElementById('fb').textContent='Bitte erst auswählen.'; return; }
    const ok = JSON.stringify([...q.correct].sort())===JSON.stringify([...sel].sort());
    quizArea.querySelectorAll('.answer').forEach(l=>{
      if (q.correct.includes(l.dataset.answer)) l.classList.add('correct');
      if (sel.includes(l.dataset.answer)&&!q.correct.includes(l.dataset.answer)) l.classList.add('wrong');
    });
    setStatus(getModule().id, q.id, ok?'correct':'wrong');
    document.getElementById('fb').textContent = ok ? '✓ Richtig!' : '✗ Falsch – richtige Antwort ist markiert.';
    updateStats();
    const btn = document.getElementById('checkBtn');
    btn.textContent = runIndex+1 < runQueue.length ? 'Nächste Frage' : 'Ergebnis anzeigen';
    btn.replaceWith(btn.cloneNode(true));
    document.getElementById('checkBtn').addEventListener('click', ()=>nextRun(q,ok,false));
  }

  function nextRun(q, ok, skipped) {
    if (!skipped) runResults.push({correct:ok});
    runIndex++;
    if (runIndex>=runQueue.length) { showResult(); return; }
    renderRunQ();
  }

  function showResult() {
    runActive=false;
    const total=runResults.length, c=runResults.filter(r=>r.correct).length, w=total-c;
    quizArea.innerHTML=`
      <div class="result-card">
        <div class="result-score">${Math.round((c/total)*100)}%</div>
        <div class="result-sub">${c} von ${total} Fragen richtig</div>
        <div class="result-breakdown">
          <div class="result-pill green">✓ Richtig: ${c}</div>
          <div class="result-pill red">✗ Falsch: ${w}</div>
        </div>
        <div class="actions" style="justify-content:center">
          <button class="primary" id="newRunBtn">Neuer 10er-Run</button>
          <button id="endlessBtn">Endlosmodus</button>
        </div>
      </div>`;
    document.getElementById('newRunBtn').addEventListener('click', startRun);
    document.getElementById('endlessBtn').addEventListener('click', ()=>{ modeSelect.value='all'; state.lastMode='all'; saveState(); startNew(); });
  }

  // ENDLOSMODUS
  function startNew() {
    runActive=false;
    if (modeSelect.value==='run10') { startRun(); return; }
    const mod=getModule(), pool=getPool(mod,modeSelect.value);
    if (!pool.length) { quizArea.innerHTML='<div class="empty">Keine Fragen für diesen Filter.</div>'; updateStats(); return; }
    currentQuestion = pool[Math.floor(Math.random()*pool.length)];
    renderEndless();
    updateStats();
  }

  function renderEndless() {
    const q=currentQuestion, multi=q.type==='multi', sh=shuffle(q.answers);
    const status=getStatus(getModule().id, q.id);
    quizArea.innerHTML=`
      <div class="question-title">${escHtml(q.question)}</div>
      <div class="question-meta">${multi?'Mehrfachauswahl':'Einfachauswahl'} · Bisher gesehen: ${status.seen}</div>
      <div class="answers">${sh.map(a=>`<label class="answer" data-answer="${escHtml(a)}"><input type="${multi?'checkbox':'radio'}" name="ans" value="${escHtml(a)}"><span>${escHtml(a)}</span></label>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="actions">
        <button class="primary" id="checkBtn">Antwort prüfen</button>
        <button id="skipBtn">Überspringen</button>
      </div>`;
    document.getElementById('checkBtn').addEventListener('click', checkEndless);
    document.getElementById('skipBtn').addEventListener('click', startNew);
  }

  function checkEndless() {
    const q=currentQuestion;
    const sel=[...quizArea.querySelectorAll('input[name="ans"]:checked')].map(i=>i.value);
    if (!sel.length) { document.getElementById('fb').textContent='Bitte erst auswählen.'; return; }
    const ok=JSON.stringify([...q.correct].sort())===JSON.stringify([...sel].sort());
    quizArea.querySelectorAll('.answer').forEach(l=>{
      if (q.correct.includes(l.dataset.answer)) l.classList.add('correct');
      if (sel.includes(l.dataset.answer)&&!q.correct.includes(l.dataset.answer)) l.classList.add('wrong');
    });
    setStatus(getModule().id, q.id, ok?'correct':'wrong');
    document.getElementById('fb').textContent = ok ? '✓ Richtig!' : '✗ Falsch – richtige Antwort ist markiert.';
    updateStats();
    const btn=document.getElementById('checkBtn');
    btn.textContent='Nächste Frage';
    btn.replaceWith(btn.cloneNode(true));
    document.getElementById('checkBtn').addEventListener('click', startNew);
  }

  function populateModules() {
    moduleSelect.innerHTML = MODULES.map(m=>`<option value="${m.id}">${m.title}</option>`).join('');
    moduleSelect.value = state.lastModuleId || MODULES[0].id;
    modeSelect.value   = state.lastMode     || 'all';
  }

  moduleSelect.addEventListener('change', ()=>{ state.lastModuleId=moduleSelect.value; saveState(); startNew(); });
  modeSelect.addEventListener('change',   ()=>{ state.lastMode=modeSelect.value;       saveState(); startNew(); });
  document.getElementById('newQuestionBtn').addEventListener('click', startNew);
  document.getElementById('resetProgressBtn').addEventListener('click', ()=>{
    if (!confirm('Wirklich den kompletten Fortschritt löschen?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state=loadState(); populateModules(); startNew();
  });

  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; installBtn.hidden=false; });
  installBtn.addEventListener('click', async ()=>{
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null; installBtn.hidden=true;
  });

  populateModules();
  startNew();

</script>
</body>
</html>
