<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCNA Final Exam Quiz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #0f3460;
    --primary: #e94560;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --text: #eaeaea;
    --muted: #8899aa;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  header { background: var(--card); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--primary); position: sticky; top:0; z-index: 100; }
  header h1 { font-size: 1.1rem; color: var(--primary); }
  #progress-text { font-size: 0.85rem; color: var(--muted); }
  #progress-bar-wrap { height: 4px; background: var(--accent); }
  #progress-bar { height: 100%; background: var(--primary); transition: width 0.4s; width: 0%; }

  /* HOME */
  #home { padding: 40px 20px; text-align: center; }
  #home h2 { font-size: 1.8rem; color: var(--primary); margin-bottom: 12px; }
  #home p { color: var(--muted); margin-bottom: 30px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; max-width: 420px; margin: 0 auto 30px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 16px; }
  .stat-card .num { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
  .stat-card .lbl { font-size: 0.75rem; color: var(--muted); }
  .btn { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 30px; font-size: 1rem; cursor: pointer; display: inline-block; margin: 6px; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn.secondary { background: var(--accent); }

  /* QUIZ */
  #quiz { display: none; padding: 20px; max-width: 720px; margin: 0 auto; }
  .question-card { background: var(--card); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
  .question-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
  .question-text { font-size: 1.05rem; line-height: 1.6; margin-bottom: 16px; }
  .exhibit-img { width: 100%; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--accent); }
  .img-error { background: var(--accent); border-radius: 8px; padding: 12px; text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .choose-hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { background: var(--accent); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; display: flex; align-items: center; gap: 12px; }
  .option:hover:not(.disabled) { border-color: var(--primary); }
  .option.selected { border-color: var(--primary); background: #1c2e5e; }
  .option.correct { border-color: var(--correct); background: #0d3b27; }
  .option.wrong { border-color: var(--wrong); background: #3b1212; }
  .option.disabled { cursor: default; }
  .option-letter { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }

  /* DRAG & DROP */
  .drag-container { display: flex; gap: 16px; flex-wrap: wrap; }
  .drag-col { flex: 1; min-width: 200px; }
  .drag-col h4 { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .drag-item { background: var(--accent); border-radius: 8px; padding: 10px 14px; cursor: grab; margin-bottom: 8px; font-size: 0.9rem; border: 2px solid transparent; user-select: none; transition: all 0.2s; }
  .drag-item:hover { border-color: var(--primary); }
  .drag-item.dragging { opacity: 0.5; }
  .drop-zone { background: #0a1628; border: 2px dashed var(--muted); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; min-height: 50px; font-size: 0.9rem; transition: all 0.2s; display: flex; flex-direction: column; gap: 6px; }
  .drop-zone-label { color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .drop-zone.over { border-color: var(--primary); background: #1a2a4a; }
  .drop-zone.correct-match { border-color: var(--correct); background: #0d3b27; }
  .drop-zone.wrong-match { border-color: var(--wrong); background: #3b1212; }
  .drop-label { color: var(--muted); font-size: 0.85rem; }
  .remove-btn { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 1.1rem; padding: 0 4px; flex-shrink:0; }
  .drop-zone .drag-item { margin-bottom: 0; }

  /* FEEDBACK */
  .feedback { border-radius: 10px; padding: 14px 16px; margin-top: 14px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.correct { background: #0d3b27; border: 1px solid var(--correct); color: var(--correct); }
  .feedback.wrong { background: #3b1212; border: 1px solid var(--wrong); color: #ff8888; }
  .feedback strong { display: block; margin-bottom: 4px; }

  /* NAV */
  .quiz-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
  .quiz-nav .btn { flex: 1; }
  #check-btn { background: var(--primary); }
  #next-btn { display: none; }

  /* RESULTS */
  #results { display: none; padding: 40px 20px; text-align: center; max-width: 520px; margin: 0 auto; }
  #results h2 { font-size: 1.8rem; color: var(--primary); margin-bottom: 20px; }
  .result-score { font-size: 4rem; font-weight: 700; color: var(--primary); margin: 20px 0; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .result-item { background: var(--card); border-radius: var(--radius); padding: 16px; }
  .result-item .val { font-size: 1.5rem; font-weight: 700; }
  .result-item .lbl { font-size: 0.8rem; color: var(--muted); }

  /* QUESTION NAV */
  #q-nav { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  #q-nav h4 { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .q-nav-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .q-dot { width: 32px; height: 32px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; transition: all 0.2s; }
  .q-dot.answered-correct { background: var(--correct); color: #000; }
  .q-dot.answered-wrong { background: var(--wrong); }
  .q-dot.current { border: 2px solid var(--primary); }
</style>
</head>
<body>

<header>
  <h1>🎓 CCNA Final Exam</h1>
  <span id="progress-text">0 / 159</span>
</header>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<!-- HOME -->
<div id="home">
  <h2>Final Exam – ITN v7</h2>
  <p>159 Fragen · Multiple Choice, Multi-Select & Drag & Drop</p>
  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="stat-total">159</div><div class="lbl">Fragen</div></div>
    <div class="stat-card"><div class="num" id="stat-done">0</div><div class="lbl">Beantwortet</div></div>
    <div class="stat-card"><div class="num" id="stat-score">–</div><div class="lbl">Score</div></div>
  </div>
  <button class="btn" onclick="startQuiz()">Quiz starten</button>
  <button class="btn secondary" onclick="startQuiz(true)">Zufällige Reihenfolge</button>
  <button class="btn secondary" onclick="resetProgress()">Reset</button>
</div>

<!-- QUIZ -->
<div id="quiz">
  <div id="q-nav">
    <h4>Fragen-Navigation</h4>
    <div class="q-nav-grid" id="q-nav-grid"></div>
  </div>
  <div class="question-card">
    <div class="question-meta" id="q-meta"></div>
    <div id="q-image"></div>
    <div class="question-text" id="q-text"></div>
    <div class="choose-hint" id="q-hint"></div>
    <div class="options" id="q-options"></div>
    <div class="feedback" id="q-feedback"></div>
  </div>
  <div class="quiz-nav">
    <button class="btn secondary" id="prev-btn" onclick="navigate(-1)">← Zurück</button>
    <button class="btn" id="check-btn" onclick="checkAnswer()">Prüfen</button>
    <button class="btn" id="next-btn" onclick="navigate(1)">Weiter →</button>
  </div>
</div>

<!-- RESULTS -->
<div id="results">
  <h2>🎉 Quiz abgeschlossen!</h2>
  <div class="result-score" id="res-score"></div>
  <div class="result-grid">
    <div class="result-item"><div class="val" id="res-correct" style="color:var(--correct)"></div><div class="lbl">Richtig</div></div>
    <div class="result-item"><div class="val" id="res-wrong" style="color:var(--wrong)"></div><div class="lbl">Falsch</div></div>
  </div>
  <button class="btn" onclick="startQuiz()">Nochmal</button>
  <button class="btn secondary" onclick="showHome()">Startseite</button>
</div>

<script src="questions.js"></script>
<script>
const IMG_BASE_URL = "https://raw.githubusercontent.com/0Timeless/ccna-quiz/main/images/";
let questions = [];
let current = 0;
let userAnswers = {};
let dragState = {};

function loadQuestions(shuffle) {
  const allQ = MODULES[0].questions;
  questions = shuffle ? [...allQ].sort(() => Math.random() - 0.5) : [...allQ];
}

function startQuiz(shuffle = false) {
  loadQuestions(shuffle);
  current = 0;
  document.getElementById('home').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  buildNavGrid();
  renderQuestion();
}

function showHome() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  updateHomeStats();
}

function updateHomeStats() {
  const answered = Object.keys(userAnswers).length;
  const correct = Object.values(userAnswers).filter(a => a.correct).length;
  document.getElementById('stat-done').textContent = answered;
  document.getElementById('stat-score').textContent = answered ? Math.round(correct/answered*100)+'%' : '–';
}

function buildNavGrid() {
  const grid = document.getElementById('q-nav-grid');
  grid.innerHTML = '';
  questions.forEach((q, i) => {
    const dot = document.createElement('div');
    dot.className = 'q-dot';
    dot.id = 'dot-'+i;
    dot.textContent = q.num;
    dot.onclick = () => { current = i; renderQuestion(); };
    grid.appendChild(dot);
  });
}

function updateNavGrid() {
  questions.forEach((q, i) => {
    const dot = document.getElementById('dot-'+i);
    if (!dot) return;
    dot.className = 'q-dot';
    if (userAnswers[q.id]) dot.classList.add(userAnswers[q.id].correct ? 'answered-correct' : 'answered-wrong');
    if (i === current) dot.classList.add('current');
  });
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  const pct = answered / questions.length * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = answered + ' / ' + questions.length;
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-meta').textContent = 'Frage ' + q.num + ' von 159';
  document.getElementById('q-text').textContent = q.question;

  // Image
  const imgDiv = document.getElementById('q-image');
  imgDiv.innerHTML = '';
  if (q.image && !q.image.startsWith('match-')) {
    const img = document.createElement('img');
    img.className = 'exhibit-img';
    img.src = IMG_BASE_URL + q.image;
    img.alt = 'Exhibit Frage ' + q.num;
    img.onerror = () => { imgDiv.innerHTML = '<div class="img-error">⚠️ Bild nicht verfügbar: ' + q.image + '</div>'; };
    imgDiv.appendChild(img);
  }

  // Hint
  const hint = document.getElementById('q-hint');
  if (q.type === 'multi') hint.textContent = '(Wähle ' + q.correct.length + ' Antworten)';
  else if (q.type === 'drag') hint.textContent = '(Drag & Drop – ziehe die linken Begriffe auf die richtige Kategorie)';
  else hint.textContent = '';

  // Options / Drag
  const optDiv = document.getElementById('q-options');
  optDiv.innerHTML = '';
  if (q.type === 'drag') renderDrag(q, optDiv);
  else renderOptions(q, optDiv);

  // Feedback
  const fb = document.getElementById('q-feedback');
  fb.style.display = 'none';

  // Restore answer if exists
  const saved = userAnswers[q.id];
  if (saved) restoreAnswer(q, saved);

  // Buttons
  document.getElementById('check-btn').style.display = saved ? 'none' : 'inline-block';
  document.getElementById('next-btn').style.display = saved ? 'inline-block' : 'none';
  document.getElementById('prev-btn').style.display = current > 0 ? 'inline-block' : 'none';

  updateNavGrid();
  window.scrollTo(0,0);
}

function renderOptions(q, container) {
  const letters = 'ABCDEFGHIJKLMNOP';
  q.answers.forEach((ans, i) => {
    const el = document.createElement('div');
    el.className = 'option';
    el.dataset.value = ans;
    el.innerHTML = '<div class="option-letter">' + letters[i] + '</div><span>' + ans + '</span>';
    el.onclick = () => selectOption(el, q);
    container.appendChild(el);
  });
}

function selectOption(el, q) {
  if (el.classList.contains('disabled')) return;
  if (q.type === 'single') {
    document.querySelectorAll('#q-options .option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
  } else {
    el.classList.toggle('selected');
    const selected = document.querySelectorAll('#q-options .option.selected');
    if (selected.length > q.correct.length) el.classList.remove('selected');
  }
}

// DRAG & DROP
function renderDrag(q, container) {
  dragState = {};
  q.pairs.forEach(([left]) => dragState[left] = null);

  const dc = document.createElement('div');
  dc.className = 'drag-container';

  const leftCol = document.createElement('div');
  leftCol.className = 'drag-col';
  leftCol.innerHTML = '<h4>Begriffe</h4>';
  const leftItems = document.createElement('div');
  leftItems.id = 'drag-source';

  const rightCol = document.createElement('div');
  rightCol.className = 'drag-col';
  rightCol.innerHTML = '<h4>Kategorien</h4>';

  // Shuffle left items
  const pairs = [...q.pairs].sort(() => Math.random() - 0.5);
  const targets = [...new Set(q.pairs.map(p => p[1]))];

  pairs.forEach(([left]) => {
    const item = document.createElement('div');
    item.className = 'drag-item';
    item.textContent = left;
    item.draggable = true;
    item.dataset.value = left;
    item.id = 'drag-' + left.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'');
    item.addEventListener('dragstart', e => { e.dataTransfer.setData('text', left); item.classList.add('dragging'); });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    // Touch
    addTouchDrag(item);
    leftItems.appendChild(item);
  });
  leftCol.appendChild(leftItems);

  targets.forEach(target => {
    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    zone.dataset.target = target;
    const lbl = document.createElement('div');
    lbl.className = 'drop-zone-label';
    lbl.textContent = target;
    zone.appendChild(lbl);
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('over');
      const val = e.dataTransfer.getData('text');
      dropToZone(zone, val, leftItems);
    });
    rightCol.appendChild(zone);
  });

  dc.appendChild(leftCol);
  dc.appendChild(rightCol);
  container.appendChild(dc);
}

function dropToZone(zone, val, sourceContainer) {
  const item = document.getElementById('drag-' + val.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,''));
  if (!item) return;
  // If item was already in a zone, just clear its dragState entry (don't send back to source)
  const prevParent = item.parentElement;
  if (prevParent && prevParent.classList.contains('drop-zone')) {
    dragState[val] = null;
  }
  // Append to new zone (multiple items allowed per zone)
  zone.appendChild(item);
  dragState[val] = zone.dataset.target;
}

function addTouchDrag(item) {
  let clone = null;
  item.addEventListener('touchstart', e => {
    clone = item.cloneNode(true);
    clone.style.cssText = 'position:fixed;opacity:0.7;pointer-events:none;z-index:9999;width:'+item.offsetWidth+'px;background:#e94560;color:white;border-radius:8px;padding:10px 14px;font-size:0.9rem;';
    document.body.appendChild(clone);
  }, {passive: true});
  item.addEventListener('touchmove', e => {
    if (!clone) return;
    const t = e.touches[0];
    clone.style.left = (t.clientX - clone.offsetWidth/2) + 'px';
    clone.style.top = (t.clientY - 20) + 'px';
  }, {passive: true});
  item.addEventListener('touchend', e => {
    if (!clone) return;
    const t = e.changedTouches[0];
    clone.remove(); clone = null;
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const zone = el ? el.closest('.drop-zone') : null;
    const source = document.getElementById('drag-source');
    if (zone && source) dropToZone(zone, item.dataset.value, source);
  });
}

function checkAnswer() {
  const q = questions[current];
  let correct = false;

  if (q.type === 'drag') {
    const allFilled = q.pairs.every(([left]) => dragState[left] !== null);
    if (!allFilled) { alert('Bitte alle Begriffe zuordnen!'); return; }
    correct = q.pairs.every(([left, right]) => dragState[left] === right);
    // Color zones: correct only if ALL items in zone belong there
    document.querySelectorAll('.drop-zone').forEach(zone => {
      const items = zone.querySelectorAll('.drag-item');
      if (items.length === 0) return;
      const allCorrect = [...items].every(item => q.correct[item.dataset.value] === zone.dataset.target);
      zone.classList.add(allCorrect ? 'correct-match' : 'wrong-match');
    });
    document.querySelectorAll('.drag-item, .drop-zone').forEach(el => el.style.pointerEvents = 'none');
    showFeedback(q, correct);
  } else {
    const selected = [...document.querySelectorAll('#q-options .option.selected')].map(el => el.dataset.value);
    if (!selected.length) { alert('Bitte eine Antwort auswählen!'); return; }

    const correctSet = new Set(q.correct);
    const selectedSet = new Set(selected);
    correct = correctSet.size === selectedSet.size && [...correctSet].every(c => selectedSet.has(c));

    document.querySelectorAll('#q-options .option').forEach(el => {
      el.classList.add('disabled');
      if (q.correct.includes(el.dataset.value)) el.classList.add('correct');
      else if (selected.includes(el.dataset.value)) el.classList.add('wrong');
    });
    showFeedback(q, correct, selected);
  }

  userAnswers[q.id] = { correct, timestamp: Date.now() };
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'inline-block';
  updateNavGrid();
  updateProgress();
  updateHomeStats();

  if (Object.keys(userAnswers).length === questions.length) {
    setTimeout(showResults, 1200);
  }
}

function showFeedback(q, correct, selected) {
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback ' + (correct ? 'correct' : 'wrong');
  if (correct) {
    fb.innerHTML = '<strong>✅ Richtig!</strong>';
  } else {
    fb.innerHTML = '<strong>❌ Falsch!</strong>Richtige Antwort: ' + q.correct.join(', ');
  }
  fb.style.display = 'block';
}

function restoreAnswer(q, saved) {
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback ' + (saved.correct ? 'correct' : 'wrong');
  if (saved.correct) fb.innerHTML = '<strong>✅ Richtig!</strong>';
  else fb.innerHTML = '<strong>❌ Falsch!</strong>Richtige Antwort: ' + q.correct.join(', ');
  fb.style.display = 'block';

  if (q.type !== 'drag') {
    document.querySelectorAll('#q-options .option').forEach(el => {
      el.classList.add('disabled');
      if (q.correct.includes(el.dataset.value)) el.classList.add('correct');
    });
  }
}

function navigate(dir) {
  current = Math.max(0, Math.min(questions.length - 1, current + dir));
  renderQuestion();
}

function showResults() {
  const total = questions.length;
  const correct = Object.values(userAnswers).filter(a => a.correct).length;
  const pct = Math.round(correct / total * 100);
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('res-score').textContent = pct + '%';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = total - correct;
}

function resetProgress() {
  if (!confirm('Fortschritt zurücksetzen?')) return;
  userAnswers = {};
  updateHomeStats();
}

// Register SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

updateHomeStats();
</script>
</body>
</html>
